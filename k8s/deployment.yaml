
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp279-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp279-api
  template:
    metadata:
      labels:
        app: mp279-api
    spec:
      containers:
        - name: mp279-api
          image: mp279-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mp279-svc
spec:
  selector:
    app: mp279-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

